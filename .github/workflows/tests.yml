name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux tkinter support
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Import smoke checks
        run: |
          python -c "import tico_asset_builder"
          python -c "import tico_asset_builder.cli"
          python -c "import tico_asset_builder.prepare_cli"
          python -c "import tico_asset_builder.combined_cli"
          python -c "import tico_asset_builder.gui"
          python -c "import tico_asset_builder.modern_gui"

      - name: CLI help smoke checks
        run: |
          tico-build-tico-folder --help
          tico-prepare-roms --help
          tico-asset-builder --help
          tico-asset-builder-gui --help
          tico-asset-builder-modern-gui --help

      - name: Run tests
        run: python -m pytest

  modern-gui:
    name: Optional modern GUI extra
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux tkinter support
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with modern GUI extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[modern-gui]" pytest

      - name: Modern GUI import smoke check
        run: python -c "import tico_asset_builder.modern_gui"

      - name: Run tests
        run: python -m pytest
