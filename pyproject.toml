[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tico-asset-builder"
version = "0.1.0"
description = "Build Tico-compatible cover asset folders from local ROM libraries."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Brett Smeltzer" }]
keywords = ["tico", "roms", "cover-art", "local-first", "emulation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: MacOS X",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Topic :: Utilities",
]
dependencies = [
  "Pillow>=10.0",
  "RapidFuzz>=3.0",
]

[project.optional-dependencies]
modern-gui = ["customtkinter>=5.2"]

[project.scripts]
tico-asset-builder = "tico_asset_builder.cli:main"
tico-prepare-roms = "tico_asset_builder.prepare_cli:main"
tico-build-tico-folder = "tico_asset_builder.combined_cli:main"
tico-asset-builder-gui = "tico_asset_builder.gui:main"
tico-asset-builder-modern-gui = "tico_asset_builder.modern_gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
